# ══════════════════════════════════════════════════════════════════════════════
# 1. SHELL & TERMINAL
# ══════════════════════════════════════════════════════════════════════════════

set-option -g default-shell /bin/bash

set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*:Tc"

# Allow apps to send escape sequences straight to the terminal (Kitty graphics
# protocol via Ghostty) — needed for inline images in tut/chafa
set -gq allow-passthrough on   # tmux 3.3+; silently skipped on 3.2a

# OSC 52 clipboard passthrough to Ghostty
set -s set-clipboard on

# Keep SSH_TTY/SSH_CONNECTION fresh on reattach so nvim can tell local vs
# remote sessions apart in a long-lived tmux session.
#
# Explicitly set (not -ga append) to DROP the display vars from tmux's default
# list: DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP
# XDG_SESSION_DESKTOP XDG_SESSION_TYPE. Attaching once from a bare TTY makes
# tmux record those as "unset" in the session env, which then strips them from
# every new pane — and since the broken panes can themselves attach, it never
# heals. Panes now inherit them from the server, which has the right values.
set -g update-environment "KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID"

set-window-option -q -g utf8 on


# ══════════════════════════════════════════════════════════════════════════════
# 2. GENERAL BEHAVIOR
# ══════════════════════════════════════════════════════════════════════════════

setw -g mouse on

set -g history-limit 50000       # scrollback buffer
set -g display-time 4000         # message duration (ms)
set -g display-panes-time 3000   # pane number duration (ms)
set -g repeat-time 1000          # repeatable command window (ms)
set -g focus-events on           # forward focus events to vim/nvim
setw -g aggressive-resize on     # resize to smallest viewing client
set -sg escape-time 10           # remove ESC delay in nvim

# Activity highlight (no popup)
setw -g monitor-activity on
set -g visual-activity off


# ══════════════════════════════════════════════════════════════════════════════
# 3. WINDOWS & PANES
# ══════════════════════════════════════════════════════════════════════════════

set -g base-index 1              # windows start at 1
setw -g pane-base-index 1        # panes start at 1
set -g renumber-windows on       # close window -> renumber

set-option -g automatic-rename on
set-option -g allow-rename on
# When SSH is running, show the remote pane title; otherwise show the command.
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},ssh},#{pane_title},#{pane_current_command}}'


# ══════════════════════════════════════════════════════════════════════════════
# 4. COPY MODE
# ══════════════════════════════════════════════════════════════════════════════

set-window-option -g mode-keys vi

# OSC 52 copy via terminal
set -g @copy_command "printf '\e]52;c;$(tmux save-buffer - | base64 -w0)\a'"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind   -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# Case-insensitive incremental search
bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental  \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up"   "send -X search-backward-incremental \"%%%\""


# ══════════════════════════════════════════════════════════════════════════════
# 5. PLUGINS
# ══════════════════════════════════════════════════════════════════════════════

# Installed manually (no TPM) -- see README. Loaded at the bottom of section 6.


# ══════════════════════════════════════════════════════════════════════════════
# 6. PLUGIN CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════

# --- resurrect / continuum ----------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Save session immediately on detach (don't wait for the 15-min tick)
set-hook -g client-detached 'run-shell ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'

# --- rose-pine theme ----------------------------------------------------------
set -g @rose_pine_variant 'moon'
set -g @rose_pine_host 'off'   # we render user@host in the prepend section below
set -g @rose_pine_user 'off'

set -g @rose_pine_left_separator  ' > '
set -g @rose_pine_right_separator ' < '
set -g @rose_pine_field_separator ' | '
set -g @rose_pine_window_status_separator "  "

# Status-right: PREFIX indicator, SSH indicator, git branch, pane count,
# venv, user@host.
# NOTE: the venv segment reads $VIRTUAL_ENV from the tmux *server* environment,
# not the active pane, so it renders empty unless the server itself was started
# inside an activated venv. The shell prompt shows the venv regardless.
# NOTE: continuum_save.sh MUST be in status-right to trigger periodic saves.
# rose-pine overwrites status-right, so we embed the save trigger here.
set -g @rose_pine_status_right_prepend_section '#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?client_prefix,#[fg=#eb6f92 bold]PREFIX #[default],}#{?#{==:#{pane_current_command},ssh},#[fg=#f6c177 bold]SSH #[default],}#[fg=#9ccfd8]#(cd #{pane_current_path}; b=$(git branch --show-current 2>/dev/null); [ -n "$b" ] && echo " $b ")#[default]#[fg=#908caa]#{window_panes}#[default] #([ -n "$VIRTUAL_ENV" ] && basename "$VIRTUAL_ENV")#[fg=#c4a7e7]#(whoami)@#H #[default]'

# Load plugins manually (no TPM). Order matters: resurrect before continuum,
# and rose-pine after all @rose_pine_* options above.
run-shell ~/.config/tmux/plugins/tmux-sensible/sensible.tmux
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
run-shell ~/.config/tmux/plugins/tmux-yank/yank.tmux
run-shell ~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux
run-shell ~/.config/tmux/plugins/tmux/rose-pine.tmux
run-shell ~/.config/tmux/plugins/tmux-pain-control/pain_control.tmux


# ══════════════════════════════════════════════════════════════════════════════
# 7. KEYBINDINGS
# ══════════════════════════════════════════════════════════════════════════════

# --- 7a. Prefix ---------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind c-space send-prefix

# --- 7b. Panes ----------------------------------------------------------------
unbind '"'
unbind '%'
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Swap current pane with neighbor (vim-style, repeatable)
bind -r H select-pane -L \; swap-pane -s '!' \; display-message "Pane swapped left"
bind -r J select-pane -D \; swap-pane -s '!' \; display-message "Pane swapped down"
bind -r K select-pane -U \; swap-pane -s '!' \; display-message "Pane swapped up"
bind -r L select-pane -R \; swap-pane -s '!' \; display-message "Pane swapped right"

# Send input to all panes in the current window
bind S setw synchronize-panes \; display-message "Synchronize panes: #{?pane_synchronized,ON,OFF}"

# Shared fzf color palette (rose-pine moon)
FZF_COLORS="bg+:#44415a,fg+:#e0def4,hl:#c4a7e7,hl+:#c4a7e7,header:#9ccfd8,pointer:#eb6f92"

# --- 7c. Windows --------------------------------------------------------------
# Move current window left/right in the window list (repeatable)
bind -r C-h swap-window -d -t :-1 \; display-message "Window moved left"
bind -r C-l swap-window -d -t :+1 \; display-message "Window moved right"

# prefix 1..9 select windows 1..9 (default tmux bindings); add 0 -> 10
bind 0 select-window -t :=10

# Send current window to another session (fzf session picker, excludes current)
bind-key m display-popup -E -w 50% -h 40% "\
    tmux list-sessions -F '#{session_name} │ #{session_windows} windows #{?session_attached,(attached),}' | \
    grep -v '^#{session_name} ' | \
    fzf --reverse --header='Send window \"#{window_name}\" to session' \
        --color=\"$FZF_COLORS\" | \
    cut -d' ' -f1 | \
    xargs -r -I{} tmux move-window -t {}:"

# --- 7d. Sessions -------------------------------------------------------------
unbind r
bind r command-prompt -I "#S" { rename-session "%%" }

bind Tab switch-client -l                                # last session
bind N   command-prompt -p "New session name:" "new-session -s '%%'"

# --- 7e. FZF pickers ----------------------------------------------------------

# w  -> windows in current session
bind-key w display-popup -E -w 60% -h 60% "\
    tmux list-windows -F '#{window_index} │ #{window_name} #{?window_active,(active),}' | \
    fzf --reverse --header='Switch window (current session) — prefix F for help' \
        --preview='tmux capture-pane -ep -t :{1}' \
        --preview-window=right:50% \
        --color=\"$FZF_COLORS\" | \
    cut -d' ' -f1 | \
    xargs -r -I{} tmux select-window -t :{}"

# W  -> all sessions (with window tree preview)
bind-key W display-popup -E -w 60% -h 60% "\
    tmux list-sessions -F '#{session_name} │ #{session_windows} windows #{?session_attached,(attached),}' | \
    fzf --reverse --header='Switch session (all) — prefix F for help' \
        --preview='tmux list-windows -F \"  #{window_index}: #{window_name} #{?window_active,*,}\" -t {1}' \
        --preview-window=right:40% \
        --color=\"$FZF_COLORS\" | \
    cut -d' ' -f1 | \
    xargs -r tmux switch-client -t"

# s / a -> sessions (identical bindings)
bind-key s display-popup -E -w 50% -h 40% "\
    tmux list-sessions -F '#{session_name} │ #{session_windows} windows #{?session_attached,(attached),}' | \
    fzf --reverse --header='Switch session — prefix F for help' \
        --color=\"$FZF_COLORS\" | \
    cut -d' ' -f1 | \
    xargs -r tmux switch-client -t"
bind-key a display-popup -E -w 50% -h 40% "\
    tmux list-sessions -F '#{session_name} │ #{session_windows} windows #{?session_attached,(attached),}' | \
    fzf --reverse --header='Switch session — prefix F for help' \
        --color=\"$FZF_COLORS\" | \
    cut -d' ' -f1 | \
    xargs -r tmux switch-client -t"

# p  -> all panes across sessions
bind-key p display-popup -E -w 70% -h 60% "\
    tmux list-panes -a -F '#{session_name}:#{window_index}.#{pane_index} │ #{window_name} │ #{pane_current_command} #{?pane_active,(active),}' | \
    fzf --reverse --header='Switch pane — prefix F for help' \
        --preview='tmux capture-pane -ep -t {1}' \
        --preview-window=right:50% \
        --color=\"$FZF_COLORS\" | \
    cut -d' ' -f1 | \
    xargs -r tmux switch-client -t"

# P  -> move current pane into selected window
bind-key P display-popup -E -w 60% -h 60% "\
    tmux list-windows -a -F '#{session_name}:#{window_index} │ #{window_name} #{?window_active,(current),}' | \
    fzf --reverse --header='Move pane to window — prefix F for help' \
        --preview='tmux capture-pane -ep -t {1}' \
        --preview-window=right:50% \
        --color=\"$FZF_COLORS\" | \
    cut -d' ' -f1 | \
    xargs -r -I{} tmux join-pane -t {}"

# F  -> cheatsheet for the fzf pickers themselves
bind-key F display-popup -E -h 80% -w 80% '~/.config/tmux/help/fzf-help.sh'


# ══════════════════════════════════════════════════════════════════════════════
# 8. HELP POPUPS
# ══════════════════════════════════════════════════════════════════════════════
# Help content lives in ~/.config/tmux/help/*.sh

# Main pane/window/session help (override default `?` command-list)
unbind-key '?'
bind-key '?' display-popup -E -h 80% -w 80% '~/.config/tmux/help/pane-help.sh'

# Within choose-tree (only reachable via `prefix :` then `choose-tree`,
# since `prefix w` opens our fzf picker instead):
#   H = tree-workflow tips, h = full chooser key reference,
#   ? = built-in tmux help
bind-key -T choose-tree H display-popup -E -h 80% -w 80% '~/.config/tmux/help/tree-help.sh'
bind-key -T choose-tree h display-popup -E -h 80% -w 80% '~/.config/tmux/help/chooser-help.sh'
unbind-key -T choose-tree ?
bind-key   -T choose-tree ? send -X help

# Within copy mode: H = copy-mode key reference
unbind-key -T copy-mode-vi H
bind-key   -T copy-mode-vi H display-popup -E -h 80% -w 80% '~/.config/tmux/help/copy-help.sh'


# ══════════════════════════════════════════════════════════════════════════════
# 9. THEME OVERRIDES (Rose Pine Moon)
# ══════════════════════════════════════════════════════════════════════════════
# Base: #232136 | Surface: #2a273f | Overlay: #393552
# Text: #e0def4 | Subtle: #908caa | Muted: #6e6a86
# Love: #eb6f92 | Gold: #f6c177 | Rose: #ea9a97
# Pine: #3e8fb0 | Foam: #9ccfd8 | Iris: #c4a7e7
# Highlight: low=#2a283e | med=#44415a | high=#56526e

# Same rule as the shell prompt: fills are the layered neutrals, accents are
# text only (no gold, love or rose fills).

# Message / command bar
set -g message-style         "fg=#e0def4,bg=#44415a,bold"
set -g message-command-style "fg=#9ccfd8,bg=#393552"

# Copy / selection mode (highlight-med is Rosé Pine's own selection tone)
set -g mode-style "fg=#e0def4,bg=#44415a"

# Pane borders (foam = active)
set -g pane-border-style        "fg=#393552"
set -g pane-active-border-style "fg=#9ccfd8"
set -gq pane-border-indicators off   # tmux 3.3+; silently skipped on 3.2a
set -g display-panes-colour        "#908caa"
set -g display-panes-active-colour "#9ccfd8"

# Dim inactive panes through their TEXT, not their background. A different pane
# background makes the terminal's own padding (always the terminal background)
# show up as a lighter frame around the whole window.
set -g window-style        "fg=#908caa,bg=default"
set -g window-active-style "fg=#e0def4,bg=default"

# Window status: active window is a neutral pill with iris text
set -g window-status-style          "fg=#908caa,bg=default"
set -g window-status-current-style  "fg=#c4a7e7,bg=#44415a,bold"
set -g window-status-activity-style "fg=#f6c177,bg=default"
set -g window-status-bell-style     "fg=#eb6f92,bg=#393552,bold"
set -g window-status-format         "  #I:#W  "
set -g window-status-current-format "  #I:#W  "
set -g window-status-separator      ""
