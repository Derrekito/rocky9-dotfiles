name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit, not just the tip
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

  rocky9:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9
    steps:
      - name: Base tools
        run: dnf install -y git sudo
      - uses: actions/checkout@v4
      - name: Create a user
        run: |
          useradd -m dev
          # A copy dev owns, to clone from (git refuses repos owned by others).
          cp -a "$GITHUB_WORKSPACE" /tmp/src
          chown -R dev:dev /tmp/src
      - name: Bootstrap (what a Vagrant provision.sh calls)
        run: DOTFILES_REPO=/tmp/src ./provision/bootstrap.sh dev
      - name: Re-run bootstrap (idempotent)
        run: DOTFILES_REPO=/tmp/src ./provision/bootstrap.sh dev
      - name: Build Go tools with Mason (Rocky's Go)
        # Normally installed in the background on first launch; done here so
        # the smoke test can check gopls attaches on Neovim 0.8.
        run: sudo -iu dev nvim --headless -c 'MasonInstall gopls goimports' -c 'qa'
      - name: Smoke test
        run: sudo -iu dev ~dev/rocky9-dotfiles/test/smoke.sh
